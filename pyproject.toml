[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-asr"
version = "0.1.0"
description = "Raspberry Pi 5 한국어 ASR 비교 및 실시간 배포 연구"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# 2026-10-28 RP5 Codex 검사 보고에서 확인된 반복 실험 환경.
# 기존 RP5 .venv를 변경하지 않으며, 새 환경을 구성할 때만 선택 설치한다.
zipformer = ["numpy==2.4.6", "sherpa-onnx==2.0.1"]

[project.scripts]
edge-asr = "edge_asr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
