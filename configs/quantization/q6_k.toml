# text 양자화만 변경. 기존 audio mmproj Q8·런타임·2T·디코딩 조건 유지.
[model]
family = "qwen3_gguf"
path = "models/qwen3-opt/gguf-quant-20261110-01/derived"
runtime_library = "runtimes/qwen3-opt/llama-q8-20261109-01/bridge-rp5-01/libedge_asr_gguf.so"
runtime_manifest = "runtimes/qwen3-opt/llama-q8-20261109-01/bridge-rp5-01/build.json"
num_threads = 2
language = "ko"
quantization = "q6_k"
asset_manifest = "q6_k.json"
max_total_len = 512
max_new_tokens = 128

[audio]
sample_rate_hz = 16000

[evaluation]
mode = "batch"
warmup_runs = 3
normalization = "ko_cer_v1"
output_dir = "results/optimization/opt3"
