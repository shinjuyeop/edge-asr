# 선택 실험: Q8 확정 호출에 직전 부분 토큰을 4개씩 묶어 검증.
# 전체 PCM 정확도와 1배속 비교 전에는 공유 기본으로 채택하지 않는다.
# 연속 입력은 tools replay-qwen3로 실행한다. 아래 batch는 어댑터 평가 계약이다.
# VAD·부분 갱신·토큰 표시 옵션은 docs/guides/qwen3_optimization.md의 대표 명령을 따른다.
[model]
family = "qwen3_gguf"
path = "models/qwen3-opt/gguf-q8-20261109-01"
runtime_library = "runtimes/qwen3-opt/token-draft-20261119-01/bridge/libedge_asr_gguf.so"
runtime_manifest = "runtimes/qwen3-opt/token-draft-20261119-01/bridge/build.json"
num_threads = 2
num_threads_batch = 3
cache_text_prefix = true
final_token_draft_block = 4
language = "ko"
quantization = "q8_0"
max_total_len = 512
max_new_tokens = 128

[audio]
sample_rate_hz = 16000

[evaluation]
mode = "batch"
warmup_runs = 3
normalization = "ko_cer_v1"
output_dir = "results/optimization/opt2"
