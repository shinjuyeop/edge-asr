# Q8 생성 2스레드, 음성·prefill 4스레드. 고정 text prefix KV와 physical ubatch 512.
# Hailo CNN의 실제 사용 여부는 청취 프로필 또는 계측된 워커의 장치 호출로 확인합니다.
[model]
family = "qwen3_gguf"
path = "models/qwen3-opt/gguf-q8-20261109-01"
runtime_library = "runtimes/qwen3-opt/prefix-20261112-01/bridge/libedge_asr_gguf.so"
runtime_manifest = "runtimes/qwen3-opt/prefix-20261112-01/bridge/build.json"
num_threads = 2
num_threads_batch = 4
cache_text_prefix = true
language = "ko"
quantization = "q8_0"
max_total_len = 512
max_new_tokens = 128

[audio]
sample_rate_hz = 16000

[evaluation]
mode = "batch"
warmup_runs = 3
normalization = "ko_cer_v1"
output_dir = "results/optimization/opt2"
